plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adam.journey'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.adam.journey'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3'

        ndk { abiFilters 'arm64-v8a' }            // every phone from the last ~8 years; add 'armeabi-v7a' for very old ones
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DJOURNEY_BUILD_TESTS=OFF'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')      // the same CMake project as the desktop build
        }
    }

    sourceSets {
        main {
            // The game opens "assets/models/..." etc., so the APK's assets folder must contain an "assets" folder.
            assets.srcDirs = [layout.buildDirectory.dir('staged_assets').get().asFile]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Copy the game's assets into the APK. Style A (the plain low-poly town) is left out to keep the app smaller:
// phones always run the enhanced style B.
tasks.register('stageAssets', Copy) {
    from('../../assets') {
        exclude 'models/town/**'
    }
    into(layout.buildDirectory.dir('staged_assets/assets'))
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'stageAssets' }
